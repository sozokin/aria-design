name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 runs scripts/tokens.ts directly (type stripping and import.meta.main).
          node-version: 24
          cache: npm
      - run: npm ci
      # src/tokens.css is generated from tokens/tokens.json (Figma); a hand edit fails here.
      - run: npm run tokens:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
